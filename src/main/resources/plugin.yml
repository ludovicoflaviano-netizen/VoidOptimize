name: VoidOptimize
version: 1.2.0
main: com.voidoptimize.VoidOptimize
api-version: '1.21'
author: Ludovico
website: https://github.com/ludovicoflaviano-netizen/VoidOptimize
description: Safe Paper 1.21.11 optimization with adaptive culling, guarded chunk prefetch, and overload protection.
commands:
  voidoptimize:
    description: View optimizer status, profiling, or reload configuration.
    usage: /voidoptimize [status|profile|reload]
    permission: voidoptimize.admin
permissions:
  voidoptimize.admin:
    default: op
