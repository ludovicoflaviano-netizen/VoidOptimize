name: VoidOptimize
version: 2.0.0
main: com.voidoptimize.VoidOptimize
api-version: '1.21'
author: Ludovico
website: https://github.com/ludovicoflaviano-netizen/VoidOptimize
description: Lightweight adaptive Paper 1.21.11 optimization without gameplay changes.
commands:
  voidoptimize:
    description: Open the VoidOptimize dashboard or view optimizer status.
    usage: /voidoptimize [panel|status|profile|reload]
    permission: voidoptimize.admin
permissions:
  voidoptimize.admin:
    default: op
