# VoidOptimize 1.4.0
culling:
  enabled: true
  interval-ticks: 10
  max-entities-per-pass: 300
  min-adaptive-entities: 75
  max-adaptive-entities: 600
  player-radius: 32
performance:
  adaptive: true
  sample-interval-ticks: 20
  emergency-mspt: 45.0
  resume-mspt: 35.0
  aggressive-mspt: 25.0
  conservative-mspt: 38.0
chunks:
  prefetch:
    enabled: true
    interval-ticks: 10
    radius: 1
    max-requests-per-pass: 4
    max-in-flight: 16
    max-mspt: 35.0
    directional: true
    generate-new-chunks: false
protection:
  enabled: true
  protected-entity-types:
    - ENDER_PEARL
    - WIND_CHARGE
    - BREEZE_WIND_CHARGE
cleanup:
  enabled: false
memory:
  metrics: true
panel:
  owner: VoidionMC
  toggles: {}
