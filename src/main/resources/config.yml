# VoidOptimize 2.0
# Gameplay-safe adaptive profile for Paper 1.21.11.
culling:
  enabled: false
  interval-ticks: 40
performance:
  adaptive: true
  sample-interval-ticks: 20
  emergency-mspt: 45.0
  high-player-mspt: 24.0
  resume-mspt: 20.0
memory:
  metrics: true
chunks:
  prefetch:
    enabled: true
    interval-ticks: 10
    radius: 1
    max-requests-per-pass: 3
    max-in-flight: 12
    max-mspt: 28.0
    directional: true
    generate-new-chunks: false
protection:
  enabled: true
  protected-entity-types:
    - ENDER_PEARL
    - WIND_CHARGE
    - BREEZE_WIND_CHARGE
panel:
  owner: VoidionMC
  toggles: {}
