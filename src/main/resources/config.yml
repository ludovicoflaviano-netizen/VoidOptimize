# VoidOptimize 1.5.0
culling:
  enabled: true
  interval-ticks: 20
  max-entities-per-pass: 200
  min-adaptive-entities: 50
  max-adaptive-entities: 400
  player-radius: 24
performance:
  adaptive: true
  sample-interval-ticks: 20
  emergency-mspt: 45.0
  resume-mspt: 32.0
  aggressive-mspt: 25.0
  conservative-mspt: 36.0
chunks:
  prefetch:
    enabled: true
    interval-ticks: 10
    radius: 1
    max-requests-per-pass: 4
    max-in-flight: 16
    max-mspt: 28.0
    directional: true
    generate-new-chunks: false
protection:
  enabled: true
  protected-entity-types:
    - ENDER_PEARL
    - WIND_CHARGE
    - BREEZE_WIND_CHARGE
cleanup:
  enabled: false
memory:
  metrics: true
panel:
  owner: VoidionMC
  toggles: {}
