# VoidOptimize - conservative Paper 1.21.11 optimization
# No forced garbage collection and no destructive entity clearing.

culling:
  enabled: true
  interval-ticks: 20
  max-entities-per-pass: 200
  player-radius: 32

performance:
  adaptive: true
  sample-interval-ticks: 20
  backoff-mspt: 45.0

protection:
  enabled: true
  protected-entity-types:
    - ENDER_PEARL
    - WIND_CHARGE
    - BREEZE_WIND_CHARGE

cleanup:
  enabled: false

memory:
  metrics: true
