# VoidOptimize - conservative Paper 1.21.11 optimization
# Never deletes gameplay entities and never forces System.gc().

culling:
  enabled: true
  interval-ticks: 10
  max-entities-per-pass: 300
  player-radius: 32

performance:
  adaptive: true
  sample-interval-ticks: 20
  emergency-mspt: 45.0
  resume-mspt: 35.0

chunks:
  prefetch:
    enabled: true
    interval-ticks: 10
    radius: 1
    max-requests-per-pass: 4
    max-in-flight: 16
    max-mspt: 35.0
    # false is safest. true can generate new chunks ahead of players and costs CPU.
    generate-new-chunks: false

protection:
  enabled: true
  protected-entity-types:
    - ENDER_PEARL
    - WIND_CHARGE
    - BREEZE_WIND_CHARGE

cleanup:
  enabled: false

memory:
  metrics: true
